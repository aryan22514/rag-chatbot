services:
  app:
    build: .
    image: rag-chatbot:local
    container_name: rag-chatbot
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Keeps your uploaded documents' vectors between restarts
      - chroma-data:/app/data
    restart: unless-stopped

volumes:
  chroma-data:
